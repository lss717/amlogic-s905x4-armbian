#===========================================================================
#
# This file is a part of the Rebuild Armbian
# https://github.com/ophub/amlogic-s9xxx-armbian
#
# HK1-RBOX-X4 (generic gigabit variant), 4GB-Mem, 1Gb-Nic, BCM4339-wifi
#
# Configuration: /etc/model_database.conf
# MODEL_ID="528"
# MODEL_BOARD="s905x4-gbit"
# SOC="s905x4"
#
# Amlogic S905X4 (SC2) has no open-source u-boot: the vendor u-boot reads
# partition 1 as FAT16 and executes cfgload -> bootscript (Devmfc chain).
# The fixed MBR disk signature 0x53443058 keeps root=PARTUUID=53443058-02
# stable on the SD card (USB boot uses root=/dev/sda2, set by bootscript).
#
#===========================================================================
# Set the partition values of a special board (fixed parameters)
skip_mb="16"
boot_mb="256"
bootfs_type="fat16"

# Set the bootloader write command for a special board (fixed parameters)
write_board_file="yes"
write_board_bootloader() {
    # MBR disk signature bytes 58 30 44 53 at offset 440 -> 0x53443058
    printf '\x58\x30\x44\x53' | dd of="${loop_new}" bs=1 seek=440 conv=notrunc status=none
}

# Clean the generic amlogic bootfs after the kernel files are in place
adjust_kernel_files="yes"
adjust_kernel_files_cmd() {
    cd ${tag_bootfs}
    # Drop everything the vendor cfgload -> bootscript chain never reads
    rm -f u-boot.sd u-boot.usb u-boot*.ext u-boot-*.bin boot.ini boot-emmc.scr boot-emmc.ini boot.bmp \
          armbian_first_run.txt.template "vmlinuz-${kernel_name}" *.cmd
    rm -rf extlinux
    if [[ -d "dtb/amlogic" ]]; then
        find "dtb/amlogic" -maxdepth 1 -type f -name '*.dtb' ! -name 'meson-sc2-*.dtb' -delete
        rm -rf "dtb/amlogic/overlay"
    fi
    # Keep box-config consistent with the selected rootfs type
    sed -i "s|rootfstype=ext4|rootfstype=${rootfs_type}|g" box-config/kernel-6.x.y.config
}
